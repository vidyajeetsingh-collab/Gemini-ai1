<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #212121;
    color: white;
}

body {
    overflow: hidden;
}

/* APP */

.app {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 270px;
    background: #171717;
    border-right: 1px solid #303030;
    display: flex;
    flex-direction: column;
    padding: 12px;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    padding: 12px;
    margin-bottom: 10px;
}

.new-chat {
    border: 1px solid #444;
    background: #222;
    color: white;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    font-size: 15px;
    text-align: left;
}

.new-chat:hover {
    background: #2d2d2d;
}

.chat-list {
    margin-top: 15px;
    overflow-y: auto;
    flex: 1;
}

.chat-item {
    padding: 11px;
    border-radius: 8px;
    margin-bottom: 5px;
    cursor: pointer;
    color: #ddd;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-item:hover {
    background: #2a2a2a;
}

.chat-item.active {
    background: #303030;
}

.sidebar-bottom {
    border-top: 1px solid #303030;
    padding-top: 10px;
    color: #888;
    font-size: 12px;
    text-align: center;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

/* HEADER */

.header {
    height: 60px;
    border-bottom: 1px solid #303030;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 12px;
}

.menu-button {
    display: none;
    border: 0;
    background: transparent;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

.header-title {
    font-size: 17px;
    font-weight: bold;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px 15px 150px;
}

.chat-inner {
    max-width: 850px;
    margin: auto;
}

.message {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
}

.avatar {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #444;
    font-weight: bold;
    font-size: 14px;
}

.message.user .avatar {
    background: #555;
}

.message.ai .avatar {
    background: #10a37f;
}

.message-content {
    flex: 1;
    min-width: 0;
}

.message-role {
    font-weight: bold;
    margin-bottom: 6px;
    font-size: 14px;
}

.message-text {
    line-height: 1.65;
    font-size: 15px;
    overflow-wrap: anywhere;
}

.code-block {
    background: #111;
    border: 1px solid #3b3b3b;
    border-radius: 9px;
    margin: 12px 0;
    overflow: hidden;
}

.code-header {
    background: #181818;
    border-bottom: 1px solid #333;
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #aaa;
    font-size: 12px;
}

.copy-code {
    border: 0;
    border-radius: 5px;
    padding: 5px 9px;
    background: #333;
    color: white;
    cursor: pointer;
}

.copy-code:hover {
    background: #444;
}

.code-content {
    padding: 13px;
    overflow-x: auto;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre;
}

.message-actions {
    margin-top: 9px;
    display: flex;
    gap: 7px;
}

.action-button {
    border: 1px solid #444;
    background: #282828;
    color: #ccc;
    padding: 5px 9px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}

.action-button:hover {
    background: #363636;
    color: white;
}

/* WELCOME */

.welcome {
    text-align: center;
    padding-top: 18vh;
}

.welcome h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.welcome p {
    color: #aaa;
}

/* INPUT */

.input-area {
    position: fixed;
    bottom: 0;
    left: 270px;
    right: 0;
    padding: 15px 15px 20px;
    background: linear-gradient(
        transparent,
        #212121 25%
    );
}

.input-box {
    max-width: 850px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: #303030;
    border: 1px solid #4a4a4a;
    border-radius: 16px;
    padding: 8px;
}

#messageInput {
    flex: 1;
    resize: none;
    max-height: 180px;
    min-height: 45px;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    font-size: 15px;
    padding: 12px;
    font-family: inherit;
}

#messageInput::placeholder {
    color: #888;
}

.send-button {
    width: 43px;
    height: 43px;
    border-radius: 10px;
    border: 0;
    background: white;
    color: black;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
}

.send-button:hover {
    background: #ddd;
}

.send-button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* STATUS */

.status {
    max-width: 850px;
    margin: 6px auto 0;
    text-align: center;
    color: #777;
    font-size: 11px;
}

/* TYPING */

.typing {
    display: inline-flex;
    gap: 4px;
    padding: 8px 0;
}

.typing span {
    width: 7px;
    height: 7px;
    background: #aaa;
    border-radius: 50%;
    animation: blink 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .2s;
}

.typing span:nth-child(3) {
    animation-delay: .4s;
}

@keyframes blink {

    0%,
    80%,
    100% {
        opacity: .3;
    }

    40% {
        opacity: 1;
    }
}

/* MOBILE */

@media (max-width: 700px) {

    .sidebar {
        position: fixed;
        z-index: 20;
        left: -280px;
        top: 0;
        bottom: 0;
        transition: left .2s ease;
    }

    .sidebar.open {
        left: 0;
    }

    .menu-button {
        display: block;
    }

    .input-area {
        left: 0;
        padding-bottom: 12px;
    }

    .chat {
        padding-top: 20px;
    }

    .welcome {
        padding-top: 12vh;
    }

    .welcome h1 {
        font-size: 25px;
    }

    .message {
        gap: 8px;
    }

    .avatar {
        width: 30px;
        height: 30px;
        min-width: 30px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            My AI
        </div>

        <button
            class="new-chat"
            onclick="createNewChat()"
        >
            ＋ New chat
        </button>

        <div
            class="chat-list"
            id="chatList"
        ></div>

        <div class="sidebar-bottom">
            Powered by Gemini
        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="header">

            <button
                class="menu-button"
                onclick="toggleSidebar()"
            >
                ☰
            </button>

            <div
                class="header-title"
                id="headerTitle"
            >
                My AI
            </div>

        </header>


        <section
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chatInner"
            ></div>

        </section>

    </main>

</div>


<!-- INPUT AREA -->

<div class="input-area">

    <div class="input-box">

        <textarea
            id="messageInput"
            placeholder="Message My AI..."
            rows="1"
        ></textarea>

        <button
            class="send-button"
            id="sendButton"
            onclick="sendMessage()"
        >
            ↑
        </button>

    </div>

    <div class="status">
        AI can make mistakes. Check important information.
    </div>

</div>


<script>

/* =========================
   SETTINGS
========================= */

const STORAGE_KEY = "myAI_chats";

let chats = [];

let currentChatId = null;

let isSending = false;


/* =========================
   LOAD CHATS
========================= */

function loadChats() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (saved) {

            chats = JSON.parse(saved);

        }

    } catch (error) {

        console.error(
            "Could not load chats:",
            error
        );

        chats = [];

    }


    if (!Array.isArray(chats)) {

        chats = [];

    }


    if (chats.length === 0) {

        createNewChat();

    } else {

        currentChatId =
            chats[0].id;

        renderChatList();

        renderCurrentChat();

    }

}


/* =========================
   SAVE CHATS
========================= */

function saveChats() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chats)
    );

}


/* =========================
   CREATE NEW CHAT
========================= */

function createNewChat() {

    const chat = {

        id:
            Date.now().toString(),

        title:
            "New chat",

        messages: [],

        lastInteractionId:
            null

    };


    chats.unshift(chat);

    currentChatId =
        chat.id;

    saveChats();

    renderChatList();

    renderCurrentChat();

}


/* =========================
   GET CURRENT CHAT
========================= */

function getCurrentChat() {

    return chats.find(
        chat =>
            chat.id === currentChatId
    );

}


/* =========================
   CHAT LIST
========================= */

function renderChatList() {

    const list =
        document.getElementById(
            "chatList"
        );

    list.innerHTML = "";


    chats.forEach(chat => {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "chat-item " +
            (
                chat.id === currentChatId
                    ? "active"
                    : ""
            );


        item.textContent =
            chat.title;


        item.onclick = () => {

            currentChatId =
                chat.id;

            renderChatList();

            renderCurrentChat();

            closeSidebar();

        };


        list.appendChild(item);

    });

}


/* =========================
   RENDER CHAT
========================= */

function renderCurrentChat() {

    const chat =
        getCurrentChat();

    const container =
        document.getElementById(
            "chatInner"
        );

    const title =
        document.getElementById(
            "headerTitle"
        );


    container.innerHTML = "";


    if (!chat) {

        return;

    }


    title.textContent =
        chat.title === "New chat"
            ? "My AI"
            : chat.title;


    if (chat.messages.length === 0) {

        container.innerHTML = `

            <div class="welcome">

                <h1>
                    How can I help you?
                </h1>

                <p>
                    Ask me anything.
                </p>

            </div>

        `;

        return;

    }


    chat.messages.forEach(
        (message, index) => {

            renderMessage(
                message.role,
                message.text,
                index
            );

        }
    );


    scrollToBottom();

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(
    role,
    text,
    index
) {

    const container =
        document.getElementById(
            "chatInner"
        );


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message " + role;


    const avatar =
        role === "user"
            ? "You"
            : "AI";


    let formattedText;


    if (role === "ai") {

        formattedText =
            formatAI(text);

    } else {

        formattedText =
            escapeHTML(text)
                .replace(
                    /\n/g,
                    "<br>"
                );

    }


    wrapper.innerHTML = `

        <div class="avatar">
            ${avatar}
        </div>

        <div class="message-content">

            <div class="message-role">
                ${
                    role === "user"
                        ? "You"
                        : "My AI"
                }
            </div>

            <div class="message-text">
                ${formattedText}
            </div>

            ${
                role === "ai"
                ?
                `

                <div class="message-actions">

                    <button
                        class="action-button"
                        onclick="copyAnswer(this)"
                    >
                        Copy
                    </button>

                    <button
                        class="action-button"
                        onclick="regenerate(${index})"
                    >
                        Regenerate
                    </button>

                </div>

                `
                :
                ""
            }

        </div>

    `;


    container.appendChild(wrapper);

}


/* =========================
   FORMAT AI TEXT
========================= */

function formatAI(text) {

    let escaped =
        escapeHTML(text);


    /*
      Code blocks
    */

    escaped =
        escaped.replace(
            /```([a-zA-Z0-9+#.-]*)\n?([\s\S]*?)```/g,
            function(
                match,
                language,
                code
            ) {

                const lang =
                    language || "code";


                const safeCode =
                    code.trim();


                return `

                    <div class="code-block">

                        <div class="code-header">

                            <span>
                                ${lang}
                            </span>

                            <button
                                class="copy-code"
                                onclick="copyCode(this)"
                            >
                                Copy
                            </button>

                        </div>

                        <div class="code-content">
${safeCode}
                        </div>

                    </div>

                `;

            }
        );


    /*
      Inline code
    */

    escaped =
        escaped.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );


    /*
      Bold
    */

    escaped =
        escaped.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    /*
      New lines
    */

    escaped =
        escaped.replace(
            /\n/g,
            "<br>"
        );


    return escaped;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    if (isSending) {

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    const chat =
        getCurrentChat();


    if (!chat) {

        return;

    }


    isSending = true;


    document.getElementById(
        "sendButton"
    ).disabled = true;


    /*
      Add user message
    */

    chat.messages.push({

        role: "user",

        text: text

    });


    /*
      Create title from first message
    */

    if (
        chat.title === "New chat" &&
        chat.messages.length === 1
    ) {

        chat.title =
            text.length > 30
                ? text.substring(
                    0,
                    30
                ) + "..."
                : text;

    }


    input.value = "";

    autoResize();


    saveChats();

    renderChatList();

    renderCurrentChat();


    showTyping();


    try {

        /*
          Send the user's message
          to our Netlify Function.
        */

        const response =
            await fetch(
                "/.netlify/functions/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            previousInteractionId:
                                chat.lastInteractionId

                        })

                }
            );


        let data;


        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                "The server returned an invalid response."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "AI server error."
            );

        }


        if (
            typeof data.answer !== "string" ||
            !data.answer.trim()
        ) {

            throw new Error(
                "The AI returned an empty response."
            );

        }


        /*
          Save Gemini interaction ID
          for the next message.
        */

        chat.lastInteractionId =
            data.interactionId ||
            null;


        /*
          Add AI answer
        */

        chat.messages.push({

            role: "ai",

            text:
                data.answer

        });


        saveChats();

        renderCurrentChat();


    } catch (error) {

        console.error(
            "AI connection error:",
            error
        );


        chat.messages.push({

            role: "ai",

            text:
                "Sorry, I couldn't connect to the AI right now.\n\n" +
                "Error: " +
                error.message

        });


        saveChats();

        renderCurrentChat();

    } finally {

        hideTyping();


        isSending = false;


        document.getElementById(
            "sendButton"
        ).disabled = false;


        input.focus();

    }

}


/* =========================
   TYPING INDICATOR
========================= */

function showTyping() {

    const container =
        document.getElementById(
            "chatInner"
        );


    const typing =
        document.createElement(
            "div"
        );


    typing.id =
        "typingIndicator";


    typing.className =
        "message ai";


    typing.innerHTML = `

        <div class="avatar">
            AI
        </div>

        <div class="message-content">

            <div class="message-role">
                My AI
            </div>

            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    container.appendChild(typing);

    scrollToBottom();

}


/* =========================
   REMOVE TYPING
========================= */

function hideTyping() {

    const typing =
        document.getElementById(
            "typingIndicator"
        );


    if (typing) {

        typing.remove();

    }

}


/* =========================
   COPY ANSWER
========================= */

async function copyAnswer(button) {

    const messageContent =
        button.closest(
            ".message-content"
        );


    const text =
        messageContent
            .querySelector(
                ".message-text"
            )
            .innerText;


    try {

        await navigator.clipboard
            .writeText(text);


        button.textContent =
            "Copied ✓";


        setTimeout(() => {

            button.textContent =
                "Copy";

        }, 1500);


    } catch {

        alert(
            "Copy failed."
        );

    }

}


/* =========================
   COPY CODE
========================= */

async function copyCode(button) {

    const block =
        button.closest(
            ".code-block"
        );


    const code =
        block
            .querySelector(
                ".code-content"
            )
            .innerText;


    try {

        await navigator.clipboard
            .writeText(code);


        button.textContent =
            "Copied ✓";


        setTimeout(() => {

            button.textContent =
                "Copy";

        }, 1500);


    } catch {

        alert(
            "Copy failed."
        );

    }

}


/* =========================
   REGENERATE
========================= */

async function regenerate(index) {

    if (isSending) {

        return;

    }


    const chat =
        getCurrentChat();


    if (!chat) {

        return;

    }


    /*
      Only regenerate the latest
      AI response in this version.
    */

    if (
        index !==
            chat.messages.length - 1 ||
        chat.messages[index].role !==
            "ai"
    ) {

        alert(
            "Regenerate the latest AI response."
        );

        return;

    }


    /*
      Remove current AI response.
    */

    chat.messages.pop();


    const userMessage =
        chat.messages[
            chat.messages.length - 1
        ];


    if (
        !userMessage ||
        userMessage.role !== "user"
    ) {

        return;

    }


    /*
      Start a fresh interaction for
      the regenerated answer.
    */

    chat.lastInteractionId =
        null;


    saveChats();

    renderCurrentChat();


    isSending = true;


    document.getElementById(
        "sendButton"
    ).disabled = true;


    showTyping();


    try {

        const response =
            await fetch(
                "/.netlify/functions/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                userMessage.text,

                            previousInteractionId:
                                null

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Regeneration failed."
            );

        }


        if (
            !data.answer
        ) {

            throw new Error(
                "The AI returned no answer."
            );

        }


        chat.lastInteractionId =
            data.interactionId ||
            null;


        chat.messages.push({

            role: "ai",

            text:
                data.answer

        });


        saveChats();

        renderCurrentChat();


    } catch (error) {

        chat.messages.push({

            role: "ai",

            text:
                "Regeneration failed.\n\n" +
                error.message

        });


        saveChats();

        renderCurrentChat();

    } finally {

        hideTyping();


        isSending = false;


        document.getElementById(
            "sendButton"
        ).disabled = false;

    }

}


/* =========================
   ENTER KEY
========================= */

function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================
   TEXTAREA
========================= */

const input =
    document.getElementById(
        "messageInput"
    );


input.addEventListener(
    "keydown",
    handleKey
);


input.addEventListener(
    "input",
    autoResize
);


function autoResize() {

    input.style.height =
        "auto";


    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) + "px";

}


/* =========================
   SCROLL
========================= */

function scrollToBottom() {

    const chat =
        document.getElementById(
            "chat"
        );


    setTimeout(() => {

        chat.scrollTop =
            chat.scrollHeight;

    }, 50);

}


/* =========================
   MOBILE SIDEBAR
========================= */

function toggleSidebar() {

    document
        .getElementById(
            "sidebar"
        )
        .classList.toggle(
            "open"
        );

}


function closeSidebar() {

    document
        .getElementById(
            "sidebar"
        )
        .classList.remove(
            "open"
        );

}


/* =========================
   START APP
========================= */

loadChats();

</script>

</body>
</html>
