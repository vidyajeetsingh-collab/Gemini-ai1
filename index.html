<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d10;
    color: #f5f5f5;
    height: 100vh;
    overflow: hidden;
}

/* APP */
.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 270px;
    background: #111418;
    border-right: 1px solid #292d33;
    display: flex;
    flex-direction: column;
    transition: transform 0.25s ease;
    z-index: 20;
}

.sidebar-top {
    padding: 16px;
}

.new-chat {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #343941;
    border-radius: 10px;
    background: #191d22;
    color: white;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
}

.new-chat:hover {
    background: #22272d;
}

.new-chat span {
    font-size: 18px;
    margin-right: 8px;
}

.history-title {
    padding: 10px 16px;
    color: #8d949d;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
}

.chat-history {
    flex: 1;
    overflow-y: auto;
    padding: 0 10px;
}

.chat-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 11px;
    margin-bottom: 3px;
    border-radius: 9px;
    color: #d7dbe0;
    cursor: pointer;
    font-size: 14px;
    overflow: hidden;
}

.chat-item:hover {
    background: #1c2025;
}

.chat-item.active {
    background: #242930;
}

.chat-item-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.creator-plate {
    margin: 14px;
    padding: 12px 10px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    background: rgba(255,255,255,0.045);
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
}

.creator-label {
    display: block;
    font-size: 10px;
    color: #8d949d;
    margin-bottom: 4px;
    letter-spacing: 0.7px;
    text-transform: uppercase;
}

.creator-name {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

/* HEADER */
.header {
    height: 60px;
    border-bottom: 1px solid #292d33;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 12px;
    background: #0f1114;
}

.menu-btn {
    display: none;
    border: none;
    background: transparent;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

.logo {
    font-size: 18px;
    font-weight: 600;
}

.logo small {
    color: #9da4ad;
    font-size: 11px;
    margin-left: 5px;
    font-weight: normal;
}

/* CHAT */
.chat-container {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
}

.messages {
    width: min(900px, 100%);
    margin: auto;
    padding: 28px 20px 130px;
}

.welcome {
    min-height: 55vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-direction: column;
    gap: 12px;
}

.welcome-icon {
    width: 58px;
    height: 58px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #20252b;
    font-size: 28px;
}

.welcome h1 {
    font-size: 28px;
}

.welcome p {
    color: #9ca3ab;
    max-width: 500px;
    line-height: 1.6;
}

/* MESSAGE */
.message {
    display: flex;
    gap: 14px;
    margin-bottom: 28px;
}

.avatar {
    flex: 0 0 34px;
    height: 34px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #242930;
    font-size: 16px;
}

.message.user .avatar {
    background: #303640;
}

.message-content {
    flex: 1;
    min-width: 0;
}

.message-role {
    font-size: 12px;
    color: #8f969f;
    margin-bottom: 7px;
}

.message-text {
    color: #e8eaed;
    line-height: 1.65;
    font-size: 15px;
    overflow-wrap: anywhere;
}

.message-text p {
    margin-bottom: 10px;
}

.message-text p:last-child {
    margin-bottom: 0;
}

.message-text ul,
.message-text ol {
    margin: 8px 0 12px 22px;
}

.message-text li {
    margin: 5px 0;
}

.message-text strong {
    color: white;
}

/* CODE */
.code-wrapper {
    margin: 12px 0;
    border: 1px solid #30353c;
    border-radius: 9px;
    overflow: hidden;
    background: #101216;
}

.code-header {
    height: 34px;
    padding: 0 10px;
    background: #191d22;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #9098a2;
    font-size: 11px;
}

.copy-code {
    border: none;
    background: #292e35;
    color: #d8dce1;
    border-radius: 5px;
    padding: 5px 8px;
    cursor: pointer;
    font-size: 11px;
}

.copy-code:hover {
    background: #363c44;
}

pre {
    padding: 14px;
    overflow-x: auto;
    color: #e7e9ec;
    font-family: Consolas, Monaco, monospace;
    font-size: 13px;
    line-height: 1.55;
}

.inline-code {
    background: #252a30;
    padding: 2px 5px;
    border-radius: 4px;
    font-family: Consolas, monospace;
    font-size: 0.9em;
}

/* ACTIONS */
.message-actions {
    display: flex;
    gap: 7px;
    margin-top: 10px;
}

.action-btn {
    border: 1px solid #30353c;
    background: #171a1e;
    color: #9ca3ab;
    border-radius: 7px;
    padding: 6px 9px;
    font-size: 11px;
    cursor: pointer;
}

.action-btn:hover {
    background: #23272d;
    color: white;
}

/* TYPING */
.typing {
    display: flex;
    gap: 5px;
    padding: 7px 0;
}

.typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #9ba1a8;
    animation: typing 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: 0.15s;
}

.typing span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes typing {
    0%, 60%, 100% {
        opacity: 0.25;
        transform: translateY(0);
    }
    30% {
        opacity: 1;
        transform: translateY(-3px);
    }
}

/* INPUT AREA */
.input-area {
    position: fixed;
    left: 270px;
    right: 0;
    bottom: 0;
    padding: 14px 20px 18px;
    background: linear-gradient(transparent, #0b0d10 25%);
}

.input-box {
    width: min(900px, 100%);
    margin: auto;
    border: 1px solid #353a42;
    background: #171a1f;
    border-radius: 15px;
    display: flex;
    align-items: flex-end;
    padding: 8px;
    box-shadow: 0 8px 35px rgba(0,0,0,0.25);
}

#messageInput {
    flex: 1;
    min-height: 42px;
    max-height: 150px;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    padding: 10px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
}

#messageInput::placeholder {
    color: #747b84;
}

.send-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 10px;
    background: #e9eaec;
    color: #101216;
    font-size: 18px;
    cursor: pointer;
}

.send-btn:hover {
    background: white;
}

.send-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

.footer-note {
    text-align: center;
    color: #666d75;
    font-size: 10px;
    margin-top: 7px;
}

/* OVERLAY */
.overlay {
    display: none;
}

/* MOBILE */
@media (max-width: 700px) {
    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: 10px 0 30px rgba(0,0,0,0.3);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .menu-btn {
        display: block;
    }

    .input-area {
        left: 0;
        padding: 10px 10px 14px;
    }

    .messages {
        padding: 20px 14px 120px;
    }

    .header {
        padding: 0 12px;
    }

    .welcome h1 {
        font-size: 23px;
    }

    .welcome p {
        font-size: 13px;
    }

    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        z-index: 15;
    }

    .overlay.show {
        display: block;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">
            <button class="new-chat" onclick="newChat()">
                <span>＋</span> New chat
            </button>
        </div>

        <div class="history-title">Chats</div>

        <div class="chat-history" id="chatHistory"></div>

        <div class="creator-plate">
            <span class="creator-label">Created by</span>
            <span class="creator-name">Vidyajeet Singh</span>
        </div>

    </aside>

    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- MAIN -->
    <main class="main">

        <header class="header">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>

            <div class="logo">
                Gemini AI
                <small>powered by Gemini</small>
            </div>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="messages" id="messages">

                <div class="welcome" id="welcome">
                    <div class="welcome-icon">✦</div>
                    <h1>How can I help you?</h1>
                    <p>
                        Ask questions, learn something new, write code,
                        solve problems, or explore ideas.
                    </p>
                </div>

            </div>
        </div>

    </main>
</div>

<!-- INPUT -->
<div class="input-area">

    <div class="input-box">

        <textarea
            id="messageInput"
            placeholder="Message Gemini AI..."
            rows="1"
            autocomplete="off"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
            onclick="sendMessage()"
            title="Send"
        >➤</button>

    </div>

    <div class="footer-note">
        Gemini AI can make mistakes. Check important information.
    </div>

</div>

<script>
const STORAGE_KEY = "myAI_chats";

let chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let currentChatId = null;
let isGenerating = false;

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const chatHistoryEl = document.getElementById("chatHistory");
const chatContainer = document.getElementById("chatContainer");
const welcomeEl = document.getElementById("welcome");

function saveChats() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
}

function createChat() {
    const chat = {
        id: Date.now().toString(),
        title: "New chat",
        messages: [],
        lastInteractionId: null
    };

    chats.unshift(chat);
    currentChatId = chat.id;
    saveChats();
    renderHistory();
    renderMessages();
    return chat;
}

function getCurrentChat() {
    return chats.find(chat => chat.id === currentChatId);
}

function newChat() {
    createChat();
    inputEl.focus();
    closeSidebar();
}

function renderHistory() {
    chatHistoryEl.innerHTML = "";

    chats.forEach(chat => {
        const item = document.createElement("div");

        item.className =
            "chat-item" +
            (chat.id === currentChatId ? " active" : "");

        item.innerHTML = `
            <span>💬</span>
            <span class="chat-item-text"></span>
        `;

        item.querySelector(".chat-item-text").textContent =
            chat.title || "New chat";

        item.onclick = () => {
            currentChatId = chat.id;
            renderHistory();
            renderMessages();
            closeSidebar();
        };

        chatHistoryEl.appendChild(item);
    });
}

function renderMessages() {
    messagesEl.innerHTML = "";

    const chat = getCurrentChat();

    if (!chat || chat.messages.length === 0) {
        const welcome = document.createElement("div");

        welcome.className = "welcome";

        welcome.innerHTML = `
            <div class="welcome-icon">✦</div>
            <h1>How can I help you?</h1>
            <p>
                Ask questions, learn something new, write code,
                solve problems, or explore ideas.
            </p>
        `;

        messagesEl.appendChild(welcome);
        return;
    }

    chat.messages.forEach((message, index) => {
        addMessageToScreen(
            message.role,
            message.content,
            false,
            index
        );
    });

    scrollToBottom();
}

function addMessageToScreen(role, content, animate = true, index = -1) {

    const message = document.createElement("div");

    message.className = "message " + role;

    const avatar = role === "user" ? "👤" : "✦";
    const roleName = role === "user" ? "You" : "Gemini";

    message.innerHTML = `
        <div class="avatar">${avatar}</div>

        <div class="message-content">

            <div class="message-role">${roleName}</div>

            <div class="message-text">
                ${formatText(content)}
            </div>

            ${
                role === "assistant"
                ?
                `
                <div class="message-actions">

                    <button
                        class="action-btn"
                        onclick="copyAnswer(this)"
                    >
                        Copy
                    </button>

                    ${
                        index === getCurrentChat()?.messages.length - 1
                        ?
                        `
                        <button
                            class="action-btn"
                            onclick="regenerate()"
                        >
                            Regenerate
                        </button>
                        `
                        :
                        ""
                    }

                </div>
                `
                :
                ""
            }

        </div>
    `;

    messagesEl.appendChild(message);

    if (animate) {
        scrollToBottom();
    }
}

function formatText(text) {

    if (!text) return "";

    let safe = escapeHtml(text);

    const codeBlocks = [];

    safe = safe.replace(
        /```(\w*)\n?([\s\S]*?)```/g,
        function(match, language, code) {

            const id = "code_" + codeBlocks.length;

            codeBlocks.push({
                id,
                code
            });

            return `___CODEBLOCK_${codeBlocks.length - 1}___`;
        }
    );

    safe = safe.replace(
        /`([^`]+)`/g,
        '<span class="inline-code">$1</span>'
    );

    safe = safe.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );

    safe = safe.replace(
        /^### (.*)$/gm,
        "<h3>$1</h3>"
    );

    safe = safe.replace(
        /^## (.*)$/gm,
        "<h2>$1</h2>"
    );

    safe = safe.replace(
        /^# (.*)$/gm,
        "<h1>$1</h1>"
    );

    safe = safe.replace(
        /^\- (.*)$/gm,
        "<li>$1</li>"
    );

    safe = safe.replace(
        /(<li>.*<\/li>)/gs,
        "<ul>$1</ul>"
    );

    safe = safe
        .split(/\n\n+/)
        .map(part => {
            if (
                part.startsWith("<ul>") ||
                part.startsWith("<h1>") ||
                part.startsWith("<h2>") ||
                part.startsWith("<h3>")
            ) {
                return part;
            }

            return "<p>" + part.replace(/\n/g, "<br>") + "</p>";
        })
        .join("");

    codeBlocks.forEach((block, i) => {

        const escapedCode = block.code;

        const html = `
            <div class="code-wrapper">
                <div class="code-header">
                    <span>Code</span>
                    <button
                        class="copy-code"
                        onclick="copyCode(this)"
                        data-code="${encodeURIComponent(escapedCode)}"
                    >
                        Copy
                    </button>
                </div>
                <pre>${escapedCode}</pre>
            </div>
        `;

        safe = safe.replace(
            `___CODEBLOCK_${i}___`,
            html
        );
    });

    return safe;
}

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function scrollToBottom() {
    setTimeout(() => {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }, 50);
}

async function sendMessage() {

    if (isGenerating) return;

    const message = inputEl.value.trim();

    if (!message) return;

    let chat = getCurrentChat();

    if (!chat) {
        chat = createChat();
    }

    chat.messages.push({
        role: "user",
        content: message
    });

    if (
        chat.title === "New chat" ||
        !chat.title
    ) {
        chat.title =
            message.length > 35
            ? message.substring(0, 35) + "..."
            : message;
    }

    saveChats();
    renderHistory();
    renderMessages();

    inputEl.value = "";
    autoResize();

    isGenerating = true;
    sendBtn.disabled = true;

    showTyping();

    try {

        const response = await fetch(
            "/.netlify/functions/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message,
                    previousInteractionId:
                        chat.lastInteractionId || null
                })
            }
        );

        const data = await response.json();

        removeTyping();

        if (!response.ok) {
            throw new Error(
                data.error || "Something went wrong."
            );
        }

        const answer =
            data.answer ||
            "I didn't receive an answer.";

        chat.messages.push({
            role: "assistant",
            content: answer
        });

        if (data.interactionId) {
            chat.lastInteractionId =
                data.interactionId;
        }

        saveChats();
        renderMessages();

    } catch (error) {

        removeTyping();

        chat.messages.push({
            role: "assistant",
            content:
                "Sorry, I couldn't connect to Gemini right now.\n\nError: " +
                error.message
        });

        saveChats();
        renderMessages();

    } finally {

        isGenerating = false;
        sendBtn.disabled = false;
        inputEl.focus();
    }
}

function showTyping() {

    const typing = document.createElement("div");

    typing.className = "message";
    typing.id = "typingMessage";

    typing.innerHTML = `
        <div class="avatar">✦</div>

        <div class="message-content">

            <div class="message-role">Gemini</div>

            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    `;

    messagesEl.appendChild(typing);

    scrollToBottom();
}

function removeTyping() {

    const typing =
        document.getElementById("typingMessage");

    if (typing) {
        typing.remove();
    }
}

async function copyAnswer(button) {

    const message =
        button.closest(".message");

    const text =
        message.querySelector(".message-text").innerText;

    try {

        await navigator.clipboard.writeText(text);

        const oldText = button.textContent;

        button.textContent = "Copied!";

        setTimeout(() => {
            button.textContent = oldText;
        }, 1200);

    } catch (error) {
        alert("Copy failed.");
    }
}

async function copyCode(button) {

    const code =
        decodeURIComponent(button.dataset.code);

    try {

        await navigator.clipboard.writeText(code);

        const oldText = button.textContent;

        button.textContent = "Copied!";

        setTimeout(() => {
            button.textContent = oldText;
        }, 1200);

    } catch (error) {
        alert("Copy failed.");
    }
}

async function regenerate() {

    if (isGenerating) return;

    const chat = getCurrentChat();

    if (!chat || chat.messages.length === 0) {
        return;
    }

    const lastAssistantIndex =
        chat.messages.map(m => m.role)
        .lastIndexOf("assistant");

    if (lastAssistantIndex === -1) {
        return;
    }

    const userMessage =
        chat.messages[lastAssistantIndex - 1];

    if (!userMessage ||
        userMessage.role !== "user") {
        return;
    }

    chat.messages.splice(
        lastAssistantIndex,
        1
    );

    saveChats();
    renderMessages();

    isGenerating = true;
    sendBtn.disabled = true;

    showTyping();

    try {

        const response = await fetch(
            "/.netlify/functions/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: userMessage.content,
                    previousInteractionId: null
                })
            }
        );

        const data = await response.json();

        removeTyping();

        if (!response.ok) {
            throw new Error(
                data.error || "Regeneration failed."
            );
        }

        chat.messages.push({
            role: "assistant",
            content:
                data.answer || "No answer received."
        });

        chat.lastInteractionId =
            data.interactionId || null;

        saveChats();
        renderMessages();

    } catch (error) {

        removeTyping();

        chat.messages.push({
            role: "assistant",
            content:
                "Regeneration failed: " +
                error.message
        });

        saveChats();
        renderMessages();

    } finally {

        isGenerating = false;
        sendBtn.disabled = false;
        inputEl.focus();
    }
}

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("open");

    document
        .getElementById("overlay")
        .classList.toggle("show");
}

function closeSidebar() {

    document
        .getElementById("sidebar")
        .classList.remove("open");

    document
        .getElementById("overlay")
        .classList.remove("show");
}

function autoResize() {

    inputEl.style.height = "auto";

    inputEl.style.height =
        Math.min(inputEl.scrollHeight, 150) + "px";
}

inputEl.addEventListener(
    "input",
    autoResize
);

inputEl.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {
            event.preventDefault();
            sendMessage();
        }
    }
);

/* START */
if (chats.length === 0) {
    createChat();
} else {
    currentChatId = chats[0].id;
    renderHistory();
    renderMessages();
}

inputEl.focus();
</script>

</body>
</html>
