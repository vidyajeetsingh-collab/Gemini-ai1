<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>Vidyajeet AI Studio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#08090d;
    --panel:#101218;
    --panel2:#151820;
    --border:#262a34;
    --text:#f5f7fa;
    --muted:#9ba2af;
    --accent:#8b7cff;
    --accent2:#6d5dfc;
    --danger:#ef6461;
    --user:#272b36;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* =========================
   OPENING SCREEN
========================= */

#splashScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    background:
        radial-gradient(circle at center,rgba(111,91,252,.13),transparent 35%),
        #08090d;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    transition:opacity .8s ease,visibility .8s ease;
}

#splashScreen.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.splashContent{
    width:min(90%,600px);
    display:flex;
    flex-direction:column;
    align-items:center;
}

.splashIcon{
    width:145px;
    height:145px;
    border-radius:32px;
    object-fit:cover;
    box-shadow:
        0 0 50px rgba(126,105,255,.22),
        0 20px 50px rgba(0,0,0,.45);
    opacity:0;
    transform:scale(.75);
    animation:iconIn 1s cubic-bezier(.2,.8,.2,1) forwards;
}

.splashTitle{
    margin-top:30px;
    font-size:clamp(30px,6vw,46px);
    font-weight:750;
    letter-spacing:-1.5px;
    opacity:0;
    transform:translateY(15px);
    animation:textIn .8s ease forwards;
    animation-delay:.7s;
}

.splashSubtitle{
    margin-top:10px;
    color:#a9afbd;
    font-size:clamp(14px,3vw,18px);
    letter-spacing:.5px;
    opacity:0;
    transform:translateY(12px);
    animation:textIn .8s ease forwards;
    animation-delay:1s;
}

.creatorPlate{
    margin-top:40px;
    padding:14px 24px;
    border:1px solid rgba(255,255,255,.11);
    border-radius:15px;
    background:rgba(255,255,255,.045);
    backdrop-filter:blur(16px);
    box-shadow:0 12px 35px rgba(0,0,0,.25);
    opacity:0;
    transform:translateY(15px);
    animation:textIn .8s ease forwards;
    animation-delay:1.35s;
}

.creatorSmall{
    display:block;
    color:#858c99;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    margin-bottom:5px;
}

.creatorName{
    font-size:16px;
    font-weight:600;
    letter-spacing:.3px;
}

@keyframes iconIn{
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes textIn{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   APP
========================= */

#app{
    height:100vh;
    display:flex;
    opacity:0;
    transition:opacity .7s ease;
}

#app.show{
    opacity:1;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:280px;
    background:#0d0f14;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:14px;
    flex-shrink:0;
}

.newChat{
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#171a21;
    color:white;
    cursor:pointer;
    font-size:14px;
    text-align:left;
    transition:.2s;
}

.newChat:hover{
    background:#1d212a;
}

.searchBox{
    margin-top:12px;
}

.searchBox input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#14171e;
    color:white;
}

.chatHistory{
    flex:1;
    overflow-y:auto;
    margin-top:12px;
}

.chatItem{
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px;
    border-radius:9px;
    margin-bottom:3px;
    cursor:pointer;
    color:#d8dbe2;
    font-size:13px;
}

.chatItem:hover,
.chatItem.active{
    background:#1b1e27;
}

.chatTitle{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.chatButtons{
    display:flex;
    gap:2px;
}

.chatButtons button{
    border:0;
    background:transparent;
    color:#8f96a4;
    cursor:pointer;
    padding:3px;
}

.chatButtons button:hover{
    color:white;
}

.sidebarBottom{
    border-top:1px solid var(--border);
    padding-top:12px;
    margin-top:8px;
}

.creatorMain{
    text-align:center;
    padding:12px 5px;
}

.creatorMain .small{
    font-size:10px;
    color:#737a87;
    text-transform:uppercase;
    letter-spacing:1px;
}

.creatorMain .name{
    margin-top:4px;
    font-size:12px;
    font-weight:600;
    color:#cdd1da;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:60px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 16px;
    background:rgba(8,9,13,.9);
}

.menuButton{
    display:none;
}

.brand{
    font-weight:650;
    font-size:16px;
}

.controls{
    margin-left:auto;
    display:flex;
    gap:7px;
}

select,
.topButton{
    border:1px solid var(--border);
    background:#14171e;
    color:#dfe2e8;
    border-radius:8px;
    padding:8px 10px;
    font-size:12px;
    outline:none;
}

.topButton{
    cursor:pointer;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:25px 15px 140px;
}

.message{
    max-width:850px;
    margin:0 auto 22px;
}

.messageRow{
    display:flex;
    gap:12px;
}

.avatar{
    width:32px;
    height:32px;
    border-radius:9px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:bold;
}

.avatar.ai{
    background:#6558e8;
}

.avatar.user{
    background:#303540;
}

.messageContent{
    flex:1;
    min-width:0;
}

.role{
    font-size:12px;
    color:#858c99;
    margin-bottom:5px;
}

.text{
    line-height:1.65;
    font-size:14px;
    color:#e9ebef;
    overflow-wrap:anywhere;
}

.userBubble{
    background:var(--user);
    border-radius:13px;
    padding:11px 14px;
    display:inline-block;
}

.text pre{
    background:#0a0c10;
    border:1px solid var(--border);
    border-radius:10px;
    padding:13px;
    overflow:auto;
    margin:10px 0;
}

.text code{
    font-family:Consolas,monospace;
}

.inlineCode{
    background:#191c24;
    border-radius:5px;
    padding:2px 5px;
}

.answerActions{
    display:flex;
    gap:6px;
    margin-top:8px;
}

.answerActions button{
    border:1px solid var(--border);
    background:#12151b;
    color:#9299a6;
    padding:5px 8px;
    border-radius:7px;
    cursor:pointer;
    font-size:11px;
}

.answerActions button:hover{
    color:white;
    background:#1a1d25;
}

/* =========================
   WELCOME
========================= */

.welcome{
    max-width:850px;
    margin:80px auto;
    text-align:center;
}

.welcomeIcon{
    width:75px;
    height:75px;
    border-radius:18px;
    object-fit:cover;
    margin-bottom:18px;
}

.welcome h2{
    font-size:27px;
    margin-bottom:8px;
}

.welcome p{
    color:var(--muted);
    font-size:14px;
}

.quickPrompts{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-top:25px;
}

.quickPrompt{
    border:1px solid var(--border);
    background:#12151b;
    color:#cdd1d9;
    border-radius:10px;
    padding:9px 12px;
    cursor:pointer;
    font-size:12px;
}

.quickPrompt:hover{
    background:#1b1e26;
}

/* =========================
   INPUT
========================= */

.inputArea{
    position:fixed;
    bottom:0;
    right:0;
    left:280px;
    padding:15px 18px 18px;
    background:linear-gradient(transparent,#08090d 28%);
}

.inputWrap{
    max-width:850px;
    margin:auto;
    border:1px solid var(--border);
    background:#12151b;
    border-radius:15px;
    display:flex;
    align-items:flex-end;
    padding:8px;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
}

#messageInput{
    flex:1;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
    min-height:42px;
    max-height:150px;
    font-family:inherit;
    font-size:14px;
}

.inputButtons{
    display:flex;
    gap:5px;
}

.inputButton{
    width:38px;
    height:38px;
    border:0;
    border-radius:9px;
    background:#1b1f28;
    color:#aab0bb;
    cursor:pointer;
}

.inputButton:hover{
    color:white;
}

.sendButton{
    background:var(--accent);
    color:white;
}

.sendButton:hover{
    background:var(--accent2);
}

.typing{
    display:inline-flex;
    gap:4px;
    padding:8px 0;
}

.typing span{
    width:6px;
    height:6px;
    background:#9298a4;
    border-radius:50%;
    animation:typing 1s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes typing{
    0%,100%{opacity:.3;transform:translateY(0)}
    50%{opacity:1;transform:translateY(-3px)}
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

    .sidebar{
        position:fixed;
        left:-290px;
        top:0;
        bottom:0;
        z-index:5000;
        transition:.25s;
    }

    .sidebar.open{
        left:0;
    }

    .menuButton{
        display:block;
        border:0;
        background:transparent;
        color:white;
        font-size:20px;
        cursor:pointer;
    }

    .inputArea{
        left:0;
    }

    .topbar{
        padding:0 10px;
    }

    .controls select{
        max-width:110px;
    }

    .messages{
        padding-left:10px;
        padding-right:10px;
    }

    .welcome{
        margin:55px auto;
    }

    .splashIcon{
        width:120px;
        height:120px;
        border-radius:27px;
    }
}
</style>
</head>

<body>

<!-- ==================================================
     OPENING / COVER PAGE
================================================== -->

<div id="splashScreen">

    <div class="splashContent">

        <!-- Put ai-icon.png beside index.html -->
        <img
            src="ai-icon.png"
            class="splashIcon"
            alt="Vidyajeet AI Studio"
        >

        <h1 class="splashTitle">
            Vidyajeet AI Studio
        </h1>

        <p class="splashSubtitle">
            Next-Generation Personal Intelligence
        </p>

        <div class="creatorPlate">
            <span class="creatorSmall">
                Designed &amp; Developed by
            </span>

            <span class="creatorName">
                Vidyajeet Singh
            </span>
        </div>

    </div>

</div>


<!-- ==================================================
     MAIN AI APPLICATION
================================================== -->

<div id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <button class="newChat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="searchBox">
            <input
                type="text"
                id="searchChats"
                placeholder="Search chats..."
                oninput="renderHistory()"
            >
        </div>

        <div class="chatHistory" id="chatHistory"></div>

        <div class="sidebarBottom">
            <div class="creatorMain">
                <div class="small">Designed &amp; Developed by</div>
                <div class="name">Vidyajeet Singh</div>
            </div>
        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <button
                class="menuButton"
                onclick="toggleSidebar()"
            >
                ☰
            </button>

            <div class="brand">
                Vidyajeet AI Studio
            </div>

            <div class="controls">

                <select id="persona">
                    <option value="general">General Assistant</option>
                    <option value="teacher">Teacher</option>
                    <option value="legal">Legal Information Assistant</option>
                    <option value="coding">Coding Expert</option>
                    <option value="study">Study Assistant</option>
                    <option value="writer">Creative Writer</option>
                </select>

                <select id="thinking">
                    <option value="fast">Fast</option>
                    <option value="balanced" selected>Balanced</option>
                    <option value="deep">Deep</option>
                </select>

                <select id="mode">
                    <option value="normal">Normal</option>
                    <option value="study">Study</option>
                    <option value="coding">Coding</option>
                    <option value="quiz">Quiz</option>
                    <option value="flashcards">Flashcards</option>
                </select>

                <button
                    class="topButton"
                    onclick="toggleTheme()"
                    title="Theme"
                >
                    ◐
                </button>

            </div>

        </header>


        <section class="messages" id="messages"></section>


        <div class="inputArea">

            <div class="inputWrap">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message Vidyajeet AI Studio..."
                ></textarea>

                <div class="inputButtons">

                    <button
                        class="inputButton"
                        onclick="startVoice()"
                        title="Voice input"
                    >
                        🎤
                    </button>

                    <button
                        class="inputButton sendButton"
                        onclick="sendMessage()"
                        title="Send"
                    >
                        ➤
                    </button>

                </div>

            </div>

        </div>

    </main>

</div>


<script>
/* ==================================================
   STORAGE
================================================== */

const STORAGE_KEY = "myAI_chats";

let chats = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
);

let currentChatId = null;
let isGenerating = false;


/* ==================================================
   INITIALIZE
================================================== */

function saveChats(){
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chats)
    );
}

function createChat(){

    const chat = {
        id: Date.now().toString(),
        title: "New Chat",
        messages: [],
        lastInteractionId: null,
        favorite: false,
        pinned: false
    };

    chats.unshift(chat);
    saveChats();

    currentChatId = chat.id;

    renderHistory();
    renderMessages();
}

function getCurrentChat(){
    return chats.find(
        chat => chat.id === currentChatId
    );
}

function newChat(){
    createChat();
}


/* ==================================================
   HISTORY
================================================== */

function renderHistory(){

    const history = document.getElementById("chatHistory");

    const search = (
        document.getElementById("searchChats")?.value || ""
    ).toLowerCase();

    history.innerHTML = "";

    chats
        .filter(chat =>
            chat.title.toLowerCase().includes(search)
        )
        .forEach(chat => {

            const item = document.createElement("div");

            item.className =
                "chatItem " +
                (chat.id === currentChatId ? "active" : "");

            item.innerHTML = `
                <div class="chatTitle">
                    ${escapeHTML(chat.pinned ? "📌 " : "")}
                    ${escapeHTML(chat.title)}
                </div>

                <div class="chatButtons">

                    <button
                        onclick="toggleFavorite(event,'${chat.id}')"
                        title="Favorite"
                    >
                        ${chat.favorite ? "★" : "☆"}
                    </button>

                    <button
                        onclick="togglePin(event,'${chat.id}')"
                        title="Pin"
                    >
                        📌
                    </button>

                    <button
                        onclick="deleteChat(event,'${chat.id}')"
                        title="Delete"
                    >
                        ×
                    </button>

                </div>
            `;

            item.onclick = () => {
                currentChatId = chat.id;
                renderHistory();
                renderMessages();

                if(
                    window.innerWidth <= 760
                ){
                    document
                        .getElementById("sidebar")
                        .classList.remove("open");
                }
            };

            history.appendChild(item);
        });
}

function toggleFavorite(event,id){

    event.stopPropagation();

    const chat = chats.find(c => c.id === id);

    if(chat){
        chat.favorite = !chat.favorite;
        saveChats();
        renderHistory();
    }
}

function togglePin(event,id){

    event.stopPropagation();

    const chat = chats.find(c => c.id === id);

    if(chat){
        chat.pinned = !chat.pinned;
        saveChats();
        renderHistory();
    }
}

function deleteChat(event,id){

    event.stopPropagation();

    chats = chats.filter(c => c.id !== id);

    if(currentChatId === id){
        currentChatId = null;

        if(chats.length){
            currentChatId = chats[0].id;
        }
        else{
            createChat();
            return;
        }
    }

    saveChats();
    renderHistory();
    renderMessages();
}


/* ==================================================
   MESSAGES
================================================== */

function renderMessages(){

    const container =
        document.getElementById("messages");

    const chat = getCurrentChat();

    container.innerHTML = "";

    if(!chat || chat.messages.length === 0){

        container.innerHTML = `
            <div class="welcome">

                <img
                    src="ai-icon.png"
                    class="welcomeIcon"
                    alt="AI"
                >

                <h2>
                    How can I help you today?
                </h2>

                <p>
                    Welcome to Vidyajeet AI Studio.
                </p>

                <div class="quickPrompts">

                    <button
                        class="quickPrompt"
                        onclick="quickPrompt('Explain this topic simply')"
                    >
                        📚 Explain a topic
                    </button>

                    <button
                        class="quickPrompt"
                        onclick="quickPrompt('Help me write something')"
                    >
                        ✍️ Help me write
                    </button>

                    <button
                        class="quickPrompt"
                        onclick="quickPrompt('Help me with coding')"
                    >
                        💻 Coding help
                    </button>

                    <button
                        class="quickPrompt"
                        onclick="quickPrompt('Give me a study plan')"
                    >
                        🎓 Study plan
                    </button>

                </div>

            </div>
        `;

        return;
    }

    chat.messages.forEach((message,index) => {

        const wrapper =
            document.createElement("div");

        wrapper.className = "message";

        const isUser =
            message.role === "user";

        wrapper.innerHTML = `
            <div class="messageRow">

                <div class="avatar ${isUser ? "user" : "ai"}">
                    ${isUser ? "U" : "AI"}
                </div>

                <div class="messageContent">

                    <div class="role">
                        ${isUser ? "You" : "Vidyajeet AI"}
                    </div>

                    <div class="text ${
                        isUser ? "userBubble" : ""
                    }">
                        ${
                            isUser
                            ? escapeHTML(message.content)
                            : formatMarkdown(message.content)
                        }
                    </div>

                    ${
                        !isUser
                        ? `
                        <div class="answerActions">

                            <button
                                onclick="copyText(${index})"
                            >
                                Copy
                            </button>

                            <button
                                onclick="speakText(${index})"
                            >
                                🔊 Speak
                            </button>

                            ${
                                index ===
                                chat.messages.length - 1
                                ?
                                `<button onclick="regenerate()">
                                    Regenerate
                                </button>`
                                :
                                ""
                            }

                        </div>
                        `
                        :
                        ""
                    }

                </div>

            </div>
        `;

        container.appendChild(wrapper);
    });

    container.scrollTop =
        container.scrollHeight;
}


/* ==================================================
   SEND
================================================== */

async function sendMessage(){

    if(isGenerating) return;

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text) return;

    let chat = getCurrentChat();

    if(!chat){
        createChat();
        chat = getCurrentChat();
    }

    chat.messages.push({
        role:"user",
        content:text
    });

    if(
        chat.title === "New Chat"
    ){
        chat.title =
            text.length > 35
            ? text.substring(0,35) + "..."
            : text;
    }

    input.value = "";

    autoResize(input);

    renderHistory();
    renderMessages();

    isGenerating = true;

    showTyping();

    try{

        const persona =
            document.getElementById("persona").value;

        const thinking =
            document.getElementById("thinking").value;

        const mode =
            document.getElementById("mode").value;

        const prompt =
            buildPrompt(
                text,
                persona,
                thinking,
                mode
            );

        const response =
            await fetch(
                "/.netlify/functions/chat",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        message:prompt,
                        previousInteractionId:
                            chat.lastInteractionId
                    })
                }
            );

        const data =
            await response.json();

        removeTyping();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Something went wrong."
            );
        }

        chat.messages.push({
            role:"assistant",
            content:data.answer || "No response received."
        });

        chat.lastInteractionId =
            data.interactionId || null;

        saveChats();
        renderMessages();

    }
    catch(error){

        removeTyping();

        chat.messages.push({
            role:"assistant",
            content:
                "Sorry, I couldn't get a response right now.\n\n" +
                "**Error:** " +
                error.message
        });

        saveChats();
        renderMessages();

    }
    finally{
        isGenerating = false;
    }
}


/* ==================================================
   PROMPT BUILDER
================================================== */

function buildPrompt(
    text,
    persona,
    thinking,
    mode
){

    const personas = {

        general:
            "Act as a helpful general AI assistant.",

        teacher:
            "Act as a clear and patient teacher. Explain concepts step by step.",

        legal:
            "Act as a legal information assistant. Provide general educational legal information and clearly mention when professional legal advice may be necessary.",

        coding:
            "Act as an expert programming tutor. Give correct, practical code and explain it clearly.",

        study:
            "Act as a study assistant. Make explanations easy to understand and useful for learning.",

        writer:
            "Act as a creative writing assistant. Produce natural, polished writing."
    };

    const modes = {

        normal:
            "Answer normally and naturally.",

        study:
            "Focus on learning, explanations, examples and understanding.",

        coding:
            "Focus on programming and technical accuracy.",

        quiz:
            "Help the user learn through questions, explanations and answers.",

        flashcards:
            "Structure useful information as concise flashcard-style material."
    };

    const thinkingInstructions = {

        fast:
            "Be concise and respond efficiently.",

        balanced:
            "Give a balanced answer with enough explanation to be useful.",

        deep:
            "Analyze the problem carefully and provide a thorough answer."
    };

    return `
${personas[persona]}

${modes[mode]}

${thinkingInstructions[thinking]}

Use Markdown when useful.

User request:
${text}
`;
}


/* ==================================================
   TYPING
================================================== */

function showTyping(){

    const container =
        document.getElementById("messages");

    const typing =
        document.createElement("div");

    typing.id = "typingIndicator";
    typing.className = "message";

    typing.innerHTML = `
        <div class="messageRow">

            <div class="avatar ai">AI</div>

            <div class="messageContent">

                <div class="role">
                    Vidyajeet AI
                </div>

                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>

        </div>
    `;

    container.appendChild(typing);

    container.scrollTop =
        container.scrollHeight;
}

function removeTyping(){

    document
        .getElementById("typingIndicator")
        ?.remove();
}


/* ==================================================
   REGENERATE
================================================== */

async function regenerate(){

    if(isGenerating) return;

    const chat = getCurrentChat();

    if(!chat || chat.messages.length < 2)
        return;

    const last =
        chat.messages[chat.messages.length - 1];

    if(last.role !== "assistant")
        return;

    const userMessage =
        chat.messages[chat.messages.length - 2];

    chat.messages.pop();

    renderMessages();

    isGenerating = true;
    showTyping();

    try{

        const persona =
            document.getElementById("persona").value;

        const thinking =
            document.getElementById("thinking").value;

        const mode =
            document.getElementById("mode").value;

        const prompt =
            buildPrompt(
                userMessage.content,
                persona,
                thinking,
                mode
            );

        const response =
            await fetch(
                "/.netlify/functions/chat",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        message:prompt,
                        previousInteractionId:null
                    })
                }
            );

        const data =
            await response.json();

        removeTyping();

        if(!response.ok)
            throw new Error(
                data.error ||
                "Unable to regenerate."
            );

        chat.messages.push({
            role:"assistant",
            content:data.answer
        });

        chat.lastInteractionId =
            data.interactionId || null;

        saveChats();
        renderMessages();

    }
    catch(error){

        removeTyping();

        chat.messages.push({
            role:"assistant",
            content:
                "Regeneration failed: " +
                error.message
        });

        saveChats();
        renderMessages();

    }
    finally{
        isGenerating = false;
    }
}


/* ==================================================
   COPY
================================================== */

function copyText(index){

    const chat = getCurrentChat();

    if(!chat) return;

    const message =
        chat.messages[index];

    if(!message) return;

    navigator.clipboard.writeText(
        message.content
    );
}


/* ==================================================
   TEXT TO SPEECH
================================================== */

function speakText(index){

    const chat = getCurrentChat();

    if(!chat) return;

    const message =
        chat.messages[index];

    if(!message) return;

    if("speechSynthesis" in window){

        speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(
                message.content
            );

        speechSynthesis.speak(
            utterance
        );
    }
}


/* ==================================================
   VOICE INPUT
================================================== */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
            "Voice input is not supported by this browser."
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.interimResults = false;

    recognition.onresult = event => {

        document.getElementById(
            "messageInput"
        ).value =
            event.results[0][0].transcript;

        autoResize(
            document.getElementById(
                "messageInput"
            )
        );
    };

    recognition.start();
}


/* ==================================================
   QUICK PROMPTS
================================================== */

function quickPrompt(text){

    const input =
        document.getElementById(
            "messageInput"
        );

    input.value = text;

    autoResize(input);

    input.focus();
}


/* ==================================================
   MARKDOWN
================================================== */

function formatMarkdown(text){

    let html =
        escapeHTML(text);

    html =
        html.replace(
            /```([\s\S]*?)```/g,
            '<pre><code>$1</code></pre>'
        );

    html =
        html.replace(
            /`([^`]+)`/g,
            '<span class="inlineCode">$1</span>'
        );

    html =
        html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

    html =
        html.replace(
            /\*(.*?)\*/g,
            "<em>$1</em>"
        );

    html =
        html.replace(
            /^### (.*)$/gm,
            "<h3>$1</h3>"
        );

    html =
        html.replace(
            /^## (.*)$/gm,
            "<h2>$1</h2>"
        );

    html =
        html.replace(
            /^# (.*)$/gm,
            "<h1>$1</h1>"
        );

    html =
        html.replace(
            /\n/g,
            "<br>"
        );

    return html;
}

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* ==================================================
   TEXTAREA
================================================== */

const messageInput =
    document.getElementById(
        "messageInput"
    );

messageInput.addEventListener(
    "input",
    () => autoResize(messageInput)
);

messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);

function autoResize(element){

    element.style.height = "auto";

    element.style.height =
        Math.min(
            element.scrollHeight,
            150
        ) + "px";
}


/* ==================================================
   MOBILE SIDEBAR
================================================== */

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");
}


/* ==================================================
   THEME
================================================== */

function toggleTheme(){

    const light =
        document.body.dataset.theme === "light";

    if(light){

        document.body.dataset.theme = "";

        document.documentElement.style
            .setProperty(
                "--bg",
                "#08090d"
            );

        document.documentElement.style
            .setProperty(
                "--panel",
                "#101218"
            );

        document.documentElement.style
            .setProperty(
                "--text",
                "#f5f7fa"
            );

    }
    else{

        document.body.dataset.theme = "light";

        document.documentElement.style
            .setProperty(
                "--bg",
                "#f5f6f8"
            );

        document.documentElement.style
            .setProperty(
                "--panel",
                "#ffffff"
            );

        document.documentElement.style
            .setProperty(
                "--text",
                "#17191f"
            );
    }
}


/* ==================================================
   OPEN APPLICATION
================================================== */

function openApplication(){

    const splash =
        document.getElementById(
            "splashScreen"
        );

    const app =
        document.getElementById("app");

    splash.classList.add("hide");

    app.classList.add("show");

    if(!chats.length){

        createChat();

    }
    else{

        currentChatId =
            chats[0].id;

        renderHistory();
        renderMessages();
    }
}


/* ==================================================
   STARTUP
================================================== */

window.addEventListener(
    "load",
    () => {

        /*
         * The cover remains visible long enough
         * for the icon, title and creator plate
         * to appear before entering the AI.
         */

        setTimeout(
            openApplication,
            3200
        );
    }
);
